name: Binance Square AI Agent

on:
  workflow_dispatch:

  schedule:
    - cron: "0 10,12,15,18,21 * * *"
      timezone: "Asia/Karachi"

permissions:
  contents: write

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Binance Square skill
        run: |
          npx skills add https://github.com/binance/binance-skills-hub/tree/main/skills/binance/square-post --agent "*" -y

      - name: Run Binance Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BINANCE_SQUARE_OPENAPI_KEY: ${{ secrets.BINANCE_SQUARE_OPENAPI_KEY }}
        run: |
          python agent.py

      - name: Save news history
        run: |
          git config user.name "Binance AI Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -f posted_news.json ]; then
            git add posted_news.json
            if git diff --cached --quiet; then
              echo "No history changes to commit."
            else
              git commit -m "Update news history"
              git push
            fi
          else
            echo "posted_news.json was not created."
          fi
